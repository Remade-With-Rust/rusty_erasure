[package]
name = "rusty_erasure-accel"
description = "SIMD kernels for rusty_erasure: x86-64 SSSE3/AVX2 nibble tables and AVX2-GFNI affine transforms, aarch64 NEON, and wasm SIMD128. The workspace's only unsafe crate — every kernel gated byte-identical against the safe scalar oracle on every architecture. MIT OR Apache-2.0."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/rusty_erasure-accel"
readme = "../../README.md"
homepage.workspace = true
rust-version.workspace = true
keywords = ["erasure-coding", "simd", "avx2", "galois-field", "isa-l"]
categories = ["algorithms", "encoding", "hardware-support"]

# Deliberately NOT `workspace = true`: the workspace denies unsafe_code, and this
# crate is the single sanctioned exception (mission plan §4). Every unsafe block
# carries a `// SAFETY:` invariant and an adversarially-reviewed bounds argument.
#
# An override drops the WHOLE workspace lint table, so the unsafe-documentation
# lint is restated here — the crate holding every unsafe block must be the one
# that cannot skip a SAFETY comment (use-protection-please H-16).
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[dependencies]
rusty_erasure-core.workspace = true
