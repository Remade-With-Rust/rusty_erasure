name: release

# Cut a release by pushing a tag: `git tag -s v1.0.0 -m ... && git push --tags`.
# This workflow produces everything the hardening standard requires of a
# release artifact (use-protection-please H-12, H-31, H-32, H-38):
#   * binaries built with `cargo auditable`, so the shipped artifact carries
#     its own dependency list and can be advisory-scanned without its source;
#   * a CycloneDX SBOM per crate, attached to the release;
#   * verified binary hardening — the build FAILS if a mitigation is missing;
#   * the provenance attestation GitHub can issue for the artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  artifacts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: cargo-auditable@0.7.5,cargo-cyclonedx@0.5.9

      # Control Flow Guard is applied to the SHIPPED BINARY ONLY, never to
      # the library or to benchmark builds: it instruments indirect calls,
      # and the kernel dispatch seam is exactly that. Keeping it here means
      # the release artifact is hardened without skewing our published
      # measurements (the frame-pointer lesson, LEDGER v1.0-hardening).
      - name: build (auditable, hardened)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            export RUSTFLAGS="-C control-flow-guard"
          fi
          cargo auditable build --release --target ${{ matrix.target }} -p rusty_erasure-cli

      - name: verify binary hardening
        if: runner.os == 'Linux'
        run: |
          chmod +x tools/verify_hardening.sh
          tools/verify_hardening.sh target/${{ matrix.target }}/release/rerasure

      - name: verify Windows mitigations
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/rerasure.exe"
          $dumpbin = Get-ChildItem "C:/Program Files*/Microsoft Visual Studio/*/*/VC/Tools/MSVC" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          $h = & $dumpbin.FullName /headers $bin
          foreach ($need in @("Dynamic base", "NX compatible", "High Entropy Virtual Addresses", "Control Flow Guard")) {
            if ($h -match [regex]::Escape($need)) { "  PASS  $need" }
            else { "  FAIL  $need"; exit 1 }
          }

      - name: generate SBOM
        run: cargo cyclonedx --format json --spec-version 1.5 --all

      - name: collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          cp "target/${{ matrix.target }}/release/rerasure$ext" "dist/rerasure-${{ matrix.target }}$ext"
          find crates -name '*.cdx.json' -exec cp {} dist/ \;
          cd dist && (sha256sum * > SHA256SUMS-${{ matrix.target }}.txt || shasum -a 256 * > SHA256SUMS-${{ matrix.target }}.txt)

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/rerasure-${{ matrix.target }}*

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true
