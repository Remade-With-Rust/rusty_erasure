name: advisories

# Scheduled advisory monitoring (use-protection-please H-40).
#
# The per-PR `supply-chain` job only tells us about a dependency when someone
# opens a PR. Advisories are published against code that has not changed —
# a crate we already depend on becomes vulnerable overnight and nothing in a
# PR-triggered workflow would ever notice. This runs on a clock instead, and
# OPENS AN ISSUE when it finds something, so the signal survives a quiet week
# where nobody reads Actions output.
#
# It also carries the quarterly re-audit reminder, so the hardening plan's
# "Next review" date is enforced by a job rather than by memory.

on:
  schedule:
    - cron: "23 6 * * *" # daily
    - cron: "0 9 1 */3 *" # quarterly re-audit reminder, 1st of the quarter
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: cargo-deny@0.19.9,cargo-audit@0.22.2

      - name: advisory scan
        id: scan
        run: |
          {
            echo "## \`cargo audit\`"
            echo '```'
            cargo audit --deny warnings 2>&1 || echo "AUDIT FAILED"
            echo '```'
            echo "## \`cargo deny check advisories\`"
            echo '```'
            cargo deny check advisories 2>&1 || echo "DENY FAILED"
            echo '```'
          } > report.md
          if grep -q "FAILED" report.md; then
            echo "clean=false" >> "$GITHUB_OUTPUT"
          else
            echo "clean=true" >> "$GITHUB_OUTPUT"
          fi

      - name: open an issue on a finding
        if: steps.scan.outputs.clean == 'false'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('report.md', 'utf8');
            const title = 'Security advisory affects a dependency';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'security,automated',
            });
            if (existing.data.some(i => i.title === title)) {
              core.info('an open advisory issue already exists; not duplicating');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, body,
              labels: ['security', 'automated'],
            });

      - name: fail the run so the schedule surfaces it
        if: steps.scan.outputs.clean == 'false'
        run: exit 1

  # Fires on the quarterly cron only. The hardening plan carries a "Next
  # review" date; this makes something other than a human remember it.
  reaudit-reminder:
    if: github.event.schedule == '0 9 1 */3 *'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: 'Quarterly hardening re-audit due',
              body: [
                'The `use-protection-please` registry is recursive: each pass should move',
                'rows rightward and tighten the evidence on rows already Completed.',
                '',
                'Re-audit **in place** (`docs/plans/use-protection-please.md`): update',
                'Status/Evidence/Target, bump `Audited` in the header, append a dated line',
                'to the Audit log, then re-render the README block. Do not regenerate from',
                'the template — that discards the evidence trail.',
                '',
                'Re-run at `deep` depth: `cargo deny check`, `cargo audit --deny warnings`,',
                '`cargo vet`, `cargo geiger`, `cargo careful test`, `tools/run_semgrep.sh`,',
                'and `tools/verify_hardening.sh` against a release build.',
              ].join('\n'),
              labels: ['security', 'automated'],
            });
