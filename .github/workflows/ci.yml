name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - wasm32-unknown-unknown
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - name: check libraries on ${{ matrix.target }}
        run: >
          cargo check
          -p rusty_erasure-core -p rusty_erasure-accel
          -p rusty_erasure -p rusty_erasure-alloc
          --target ${{ matrix.target }}
      - name: check pure-safe build (--no-default-features)
        run: cargo check -p rusty_erasure --no-default-features --target ${{ matrix.target }}

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm executes the NEON kernels (M6): the portable
        # matches-scalar gate is the oracle there; macos-latest is arm64 too.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --workspace
      - run: cargo test -p rusty_erasure --no-default-features

  test-wasm:
    # Executes the SIMD128 kernels under wasmtime (M6).
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C target-feature=+simd128
      CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-wasip1
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - run: cargo test -p rusty_erasure-core -p rusty_erasure-accel -p rusty_erasure --target wasm32-wasip1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
